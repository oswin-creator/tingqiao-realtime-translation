<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1440" height="900" rx="26" fill="url(#bg)" /><text x="60" y="78" font-size="14" fill="#6b61e8" font-weight="650" letter-spacing="2">THE ANDROID COMPANION</text><text x="60" y="151" font-size="39" fill="#222942" font-weight="650" >Keep captions</text><text x="60" y="202" font-size="39" fill="#222942" font-weight="650" >close to you.</text><text x="62" y="252" font-size="25" fill="#6b61e8" font-weight="550" >把字幕放在手机上。</text><text x="62" y="309" font-size="19" fill="#838aa4" font-weight="400" >Connect to your Mac.</text><text x="62" y="340" font-size="19" fill="#838aa4" font-weight="400" >Read. Scroll. Ask when needed.</text><rect x="62" y="393" width="143" height="34" rx="17" fill="#eeecff" /><text x="133.5" y="416" font-size="15" fill="#6b61e8" font-weight="500" text-anchor="middle">Wi-Fi + QR</text><rect x="216" y="393" width="123" height="34" rx="17" fill="#eeecff" /><text x="277.5" y="416" font-size="15" fill="#6b61e8" font-weight="500" text-anchor="middle">Bluetooth</text><text x="64" y="478" font-size="18" fill="#222942" font-weight="600" >01  Connect once</text><text x="64" y="511" font-size="16" fill="#838aa4" font-weight="400" >扫码或选择已配对的电脑</text><text x="64" y="572" font-size="18" fill="#222942" font-weight="600" >02  Follow naturally</text><text x="64" y="605" font-size="16" fill="#838aa4" font-weight="400" >看原文、读译文、回到最新</text><text x="64" y="666" font-size="18" fill="#222942" font-weight="600" >03  Ask on demand</text><text x="64" y="699" font-size="16" fill="#838aa4" font-weight="400" >点一下，获取简短回答或解释</text><text x="62" y="824" font-size="12" fill="#838aa4" font-weight="500" letter-spacing="1">ILLUSTRATIVE PREVIEW</text><rect x="497" y="75" width="362" height="752" rx="42" fill="#292d43" filter="url(#shadow)"/><rect x="507" y="85" width="342" height="732" rx="34" fill="#f6f7fc" /><rect x="628" y="96" width="100" height="17" rx="9" fill="#292d43" /><text x="527" y="126" font-size="12" fill="#838aa4" font-weight="500" >9:41</text><text x="826" y="126" font-size="11" fill="#838aa4" font-weight="400" text-anchor="end">● ▰</text><rect x="623" y="800" width="110" height="4" rx="2" fill="#b4b7c9" /><rect x="924" y="75" width="362" height="752" rx="42" fill="#292d43" filter="url(#shadow)"/><rect x="934" y="85" width="342" height="732" rx="34" fill="#f6f7fc" /><rect x="1055" y="96" width="100" height="17" rx="9" fill="#292d43" /><text x="954" y="126" font-size="12" fill="#838aa4" font-weight="500" >9:41</text><text x="1253" y="126" font-size="11" fill="#838aa4" font-weight="400" text-anchor="end">● ▰</text><rect x="1050" y="800" width="110" height="4" rx="2" fill="#b4b7c9" /><rect x="525.0" y="164.6" width="2.2" height="8.8" rx="1.1" fill="#6b61e8" /><rect x="529.95" y="160.75" width="2.2" height="16.5" rx="1.1" fill="#6b61e8" /><rect x="534.9" y="156.9" width="2.2" height="24.200000000000003" rx="1.1" fill="#6b61e8" /><rect x="539.85" y="161.575" width="2.2" height="14.850000000000001" rx="1.1" fill="#6b61e8" /><rect x="544.8" y="158.55" width="2.2" height="20.900000000000002" rx="1.1" fill="#6b61e8" /><rect x="549.75" y="164.05" width="2.2" height="9.9" rx="1.1" fill="#6b61e8" /><text x="573" y="176" font-size="24" fill="#222942" font-weight="650" >听桥字幕</text><text x="525" y="210" font-size="12" fill="#838aa4" font-weight="400" >把字幕带到手边，专注眼前的交流。</text><rect x="521" y="242" width="314" height="138" rx="18" fill="white" stroke="#e7e9f4" /><text x="540" y="275" font-size="20" fill="#222942" font-weight="600" >Wi-Fi 字幕</text><text x="540" y="302" font-size="13" fill="#838aa4" font-weight="400" >与 Mac 连接到同一个网络</text><rect x="540" y="323" width="276" height="38" rx="10" fill="#eae7fe" /><text x="678" y="348" font-size="14" fill="#6b61e8" font-weight="550" text-anchor="middle">扫码连接 Wi-Fi 字幕</text><rect x="521" y="396" width="314" height="139" rx="18" fill="white" stroke="#e7e9f4" /><text x="540" y="429" font-size="20" fill="#222942" font-weight="600" >蓝牙字幕</text><text x="540" y="457" font-size="13" fill="#838aa4" font-weight="400" >无需 Wi-Fi，选择附近的 Mac</text><rect x="540" y="479" width="276" height="36" rx="10" fill="#ececf9" /><text x="678" y="503" font-size="14" fill="#6b61e8" font-weight="550" text-anchor="middle">查找附近的 Mac</text><text x="527" y="579" font-size="13" fill="#838aa4" font-weight="550" >已配对的电脑</text><rect x="521" y="597" width="314" height="80" rx="16" fill="white" stroke="#e7e9f4" /><circle cx="547" cy="626" r="5" fill="#7fbba5"/><text x="564" y="631" font-size="17" fill="#222942" font-weight="550" >演示 Mac</text><text x="541" y="658" font-size="12" fill="#838aa4" font-weight="400" >点击连接 · 已保存配对</text><text x="528" y="744" font-size="12" fill="#838aa4" font-weight="400" >字幕由 Mac 处理并同步到手机。</text><text x="951" y="176" font-size="24" fill="#222942" font-weight="650" >实时字幕</text><rect x="1153" y="154" width="101" height="34" rx="17" fill="#e4f3ec" /><text x="1203.5" y="177" font-size="11" fill="#408d72" font-weight="500" text-anchor="middle">蓝牙已连接</text><rect x="950" y="200" width="146" height="34" rx="17" fill="#eeecff" /><text x="1023.0" y="223" font-size="15" fill="#6b61e8" font-weight="500" text-anchor="middle">帮我回答</text><rect x="1108" y="200" width="149" height="34" rx="17" fill="#eeecff" /><text x="1182.5" y="223" font-size="15" fill="#6b61e8" font-weight="500" text-anchor="middle">解释刚才</text><rect x="948" y="258" width="314" height="115" rx="15" fill="white" stroke="#e7e9f4" /><text x="967" y="286" font-size="12" fill="#838aa4" font-weight="400" >오늘은 다음 단계에 대해</text><text x="967" y="322" font-size="20" fill="#222942" font-weight="550" >今天我们来讨论</text><text x="967" y="349" font-size="20" fill="#222942" font-weight="550" >接下来的安排。</text><rect x="948" y="392" width="314" height="115" rx="15" fill="white" stroke="#e7e9f4" /><text x="967" y="420" font-size="12" fill="#838aa4" font-weight="400" >회의는 월요일에 시작합니다.</text><text x="967" y="456" font-size="20" fill="#222942" font-weight="550" >会议将在周一开始。</text><rect x="948" y="526" width="314" height="115" rx="15" fill="white" stroke="#e7e9f4" /><text x="967" y="554" font-size="12" fill="#838aa4" font-weight="400" >구체적인 예를 들어 주실 수 있나요?</text><text x="967" y="590" font-size="20" fill="#222942" font-weight="550" >可以给出一个例子吗？</text><rect x="960" y="544" width="290" height="194" rx="17" fill="white" stroke="#d1caf5" filter="url(#shadow)"/><text x="976" y="574" font-size="15" fill="#6b61e8" font-weight="650" >帮我回答</text><text x="1231" y="574" font-size="14" fill="#838aa4" font-weight="400" text-anchor="end">−  +  ×</text><path d="M 972 587 H 1237" stroke="#e7e9f4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="977" y="611" font-size="12" fill="#6b61e8" font-weight="400" >›  思考过程</text><text x="977" y="642" font-size="17" fill="#222942" font-weight="550" >구체적인 예로</text><text x="977" y="667" font-size="17" fill="#222942" font-weight="550" >설명하겠습니다.</text><text x="977" y="700" font-size="14" fill="#838aa4" font-weight="400" >我用一个具体例子说明。</text><text x="976" y="725" font-size="10" fill="#838aa4" font-weight="400" >拖动标题移动 · 按 + / − 调整大小</text><text x="1367" y="863" font-size="12" fill="#838aa4" font-weight="500" text-anchor="end">SAMPLE DIALOGUE · 示例对话</text></g></svg>